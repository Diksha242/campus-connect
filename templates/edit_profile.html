{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F5F7FB;">

{% include 'components/navbar.html' %}

<div class="d-flex">
    {% include 'components/sidebar.html' %}

    <div class="container-fluid p-4" style="flex: 1; max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <h3 class="fw-bold mb-4">Edit Profile</h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="text-center mb-4">
                    {% if profile.profile_picture %}
                        <img id="profilePicPreview" src="{{ profile.profile_picture.url }}" width="120" height="120" class="rounded-circle mb-3" style="object-fit: cover; cursor: pointer;" onclick="document.getElementById('profilePictureInput').click()">
                    {% else %}
                        <img id="profilePicPreview" src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?q=80&w=400&h=400&fit=crop" width="120" height="120" class="rounded-circle mb-3" style="object-fit: cover; cursor: pointer;" onclick="document.getElementById('profilePictureInput').click()">
                    {% endif %}
                    <p class="text-muted">Tap your profile picture to change it</p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Bio</label>
                    <textarea class="form-control rounded-3" name="bio" rows="4">{{ profile.bio }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Interests</label>
                    <input type="text" class="form-control rounded-3" name="interests" value="{{ profile.interests }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Year</label>
                    <select class="form-control rounded-3" name="year">
                        <option value="">Select Year</option>
                        <option value="1st" {% if profile.year == '1st' %}selected{% endif %}>1st Year</option>
                        <option value="2nd" {% if profile.year == '2nd' %}selected{% endif %}>2nd Year</option>
                        <option value="3rd" {% if profile.year == '3rd' %}selected{% endif %}>3rd Year</option>
                        <option value="4th" {% if profile.year == '4th' %}selected{% endif %}>4th Year</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Department</label>
                    <input type="text" class="form-control rounded-3" name="department" value="{{ profile.department }}">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Profile Picture</label>
                    <input id="profilePictureInput" type="file" class="form-control rounded-3" name="profile_picture" accept="image/*" onchange="previewProfilePicture(event)">
                </div>

                <button type="submit" class="btn btn-primary rounded-pill w-100">Save Changes</button>
            </form>
        </div>
    </div>
</div>

<script>
    function previewProfilePicture(event) {
        const [file] = event.target.files;
        if (!file) return;
        const preview = document.getElementById('profilePicPreview');
        preview.src = URL.createObjectURL(file);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
