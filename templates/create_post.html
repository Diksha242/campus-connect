{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F5F7FB;">

{% include 'components/navbar.html' %}

<div class="d-flex">
    {% include 'components/sidebar.html' %}

    <div class="container-fluid p-4" style="flex: 1; max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <h3 class="fw-bold mb-4">Create a Post</h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Title</label>
                    <input type="text" class="form-control rounded-3" name="title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">What's on your mind?</label>
                    <textarea class="form-control rounded-3" name="content" rows="6" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Add Image (Optional)</label>
                    <input type="file" class="form-control rounded-3" name="image" accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary rounded-pill w-100">Post</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
