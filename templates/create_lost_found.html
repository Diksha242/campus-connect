{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Lost/Found Item - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F5F7FB;">

{% include 'components/navbar.html' %}

<div class="d-flex">
    {% include 'components/sidebar.html' %}

    <div class="container-fluid p-4" style="flex: 1; max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <h3 class="fw-bold mb-4">Post Lost/Found Item</h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Is it Lost or Found?</label>
                    <select class="form-control rounded-3" name="status" required>
                        <option value="">Select Status</option>
                        <option value="lost">Lost Item</option>
                        <option value="found">Found Item</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Item Name</label>
                    <input type="text" class="form-control rounded-3" name="item_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description</label>
                    <textarea class="form-control rounded-3" name="description" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Location</label>
                    <input type="text" class="form-control rounded-3" name="location" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Date</label>
                    <input type="date" class="form-control rounded-3" name="date_occurrence" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Item Photo</label>
                    <input type="file" class="form-control rounded-3" name="image" accept="image/*" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Contact Email</label>
                    <input type="email" class="form-control rounded-3" name="contact_email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Contact Phone</label>
                    <input type="tel" class="form-control rounded-3" name="contact_phone" required>
                </div>

                <button type="submit" class="btn btn-primary rounded-pill w-100">Post Item</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
