<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3">

    
    <div class="container-fluid">

        <!-- Logo -->

        <a class="navbar-brand fw-bold fs-3 text-primary" href="{% url 'home' %}">
            CampusConnect
        </a>


        <!-- Search Bar -->

        <form class="d-flex w-50">

            <input
                class="form-control rounded-pill px-4"
                type="search"
                placeholder="Search people, events, clubs..."
            >

        </form>


        <!-- Right Side -->

        <div class="d-flex align-items-center gap-4">

            <a href="{% url 'home' %}" class="text-dark text-decoration-none fs-5">
                🏠
            </a>

            <a href="{% url 'clubs' %}" class="text-dark text-decoration-none fs-5">
                👥
            </a>

            <a href="{% url 'notifications' %}" class="text-dark text-decoration-none fs-5">
                🔔
            </a>

            <a href="{% url 'messages' %}" class="text-dark text-decoration-none fs-5">
                💬
            </a>


            <!-- Authentication Section -->

            {% if user.is_authenticated %}
                <!-- Profile -->
                <div class="d-flex align-items-center">

                    {% if user.profile.profile_picture %}
                        <img
                            src="{{ user.profile.profile_picture.url }}"
                            width="45"
                            height="45"
                            class="rounded-circle"
                            style="object-fit: cover;"
                        >
                    {% else %}
                        <img
                            src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?q=80&w=400&h=400&fit=crop"
                            width="45"
                            height="45"
                            class="rounded-circle"
                            style="object-fit: cover;"
                        >
                    {% endif %}

                    <div class="ms-2">

                        <h6 class="mb-0 fw-bold">
                            <a href="{% url 'user_profile' user.username %}" class="text-dark text-decoration-none">{{ user.username }}</a>
                        </h6>

                        <small class="text-muted">
                            <a href="{% url 'logout' %}" class="text-muted text-decoration-none">
                                Logout
                            </a>
                        </small>

                    </div>

                </div>
            {% else %}
                <!-- Login/Signup Buttons -->
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm rounded-pill">
                    Log In
                </a>
                <a href="{% url 'signup' %}" class="btn btn-primary btn-sm rounded-pill">
                    Sign Up
                </a>
            {% endif %}

        </div>

    </div>

</nav>
