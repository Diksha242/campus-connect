{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ other_user.username }} - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F5F7FB;">

{% include 'components/navbar.html' %}

<div class="d-flex">
    {% include 'components/sidebar.html' %}

    <div class="container-fluid p-4" style="flex: 1; max-width: 700px;">
        <div class="card border-0 shadow-sm rounded-4" style="height: 600px; display: flex; flex-direction: column;">
            <!-- Chat Header -->
            <div class="p-4 border-bottom">
                <h5 class="mb-0 fw-bold">{{ other_user.username }}</h5>
            </div>

            <!-- Messages -->
            <div class="flex-grow-1 p-4" style="overflow-y: auto;">
                {% for msg in messages %}
                <div class="mb-3 d-flex {% if msg.sender == user %}justify-content-end{% endif %}">
                    <div class="p-3 rounded-3" style="max-width: 70%; {% if msg.sender == user %}background-color: #667eea; color: white;{% else %}background-color: #e9ecef;{% endif %}">
                        <p class="mb-0">{{ msg.content }}</p>
                        <small class="d-block mt-1" style="{% if msg.sender == user %}color: rgba(255,255,255,0.7);{% else %}color: #6c757d;{% endif %}">
                            {{ msg.created_at|date:"H:i" }}
                        </small>
                    </div>
                </div>
                {% endfor %}
            </div>

            <!-- Message Input -->
            <div class="p-4 border-top">
                <form method="POST" class="d-flex gap-2">
                    {% csrf_token %}
                    <input type="text" class="form-control rounded-pill" name="content" placeholder="Type a message..." required>
                    <button type="submit" class="btn btn-primary rounded-pill"><i class="bi bi-send"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Auto scroll to bottom
    document.querySelector('.flex-grow-1').scrollTop = document.querySelector('.flex-grow-1').scrollHeight;
</script>
</body>
</html>
