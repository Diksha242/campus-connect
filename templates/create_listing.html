{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F5F7FB;">

{% include 'components/navbar.html' %}

<div class="d-flex">
    {% include 'components/sidebar.html' %}

    <div class="container-fluid p-4" style="flex: 1; max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <h3 class="fw-bold mb-4">Sell an Item</h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Item Title</label>
                    <input type="text" class="form-control rounded-3" name="title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description</label>
                    <textarea class="form-control rounded-3" name="description" rows="4" required></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Price (₹)</label>
                        <input type="number" step="0.01" class="form-control rounded-3" name="price" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Category</label>
                        <select class="form-control rounded-3" name="category" required>
                            <option>Select Category</option>
                            <option value="books">Books</option>
                            <option value="electronics">Electronics</option>
                            <option value="clothing">Clothing</option>
                            <option value="furniture">Furniture</option>
                            <option value="sports">Sports Equipment</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Item Image</label>
                    <input type="file" class="form-control rounded-3" name="image" accept="image/*" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Contact Email</label>
                    <input type="email" class="form-control rounded-3" name="contact_email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Contact Phone (Optional)</label>
                    <input type="tel" class="form-control rounded-3" name="contact_phone">
                </div>

                <button type="submit" class="btn btn-primary rounded-pill w-100">List Item</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
